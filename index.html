<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JOYRUN CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<script>
(function(){
  var BUILD = '26';
  window.BUILD_ID = 'v' + BUILD;
  try {
    var params = new URLSearchParams(location.search);
    if (params.get('v') !== BUILD && sessionStorage.getItem('jr_bust') !== BUILD) {
      sessionStorage.setItem('jr_bust', BUILD);
      params.set('v', BUILD);
      location.replace(location.pathname + '?' + params.toString());
    }
  } catch(e) {}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #1456f0; --primary-hover: #0e46d0; --primary-light: #eef3fe;
  --bg: #f5f6f7; --card: #ffffff; --border: #e5e6e8; --border-strong: #d0d3d6;
  --text: #1f2329; --text-2: #646a73; --text-3: #8f959e;
  --green: #2ea44f; --green-bg: #e9f7ee;
  --amber: #d9800d; --amber-bg: #fdf3e3;
  --red: #d83931; --red-bg: #fdecea;
  --blue-bg: #e8f1fe; --blue-text: #1456f0;
  --purple-bg: #f1edfd; --purple-text: #6849c9;
  --gray-bg: #f0f1f2; --gray-text: #5f5e5a;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(31,35,41,.06), 0 4px 16px rgba(31,35,41,.06);
}
html, body { height: 100%; }
body {
  font-family: "Inter", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 15px; }

#app { display: flex; height: 100vh; overflow: hidden; }
#app.no-auth #sidebar, #app.no-auth #topbar { display: none; }

/* ---------- sidebar ---------- */
#sidebar {
  width: 216px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 14px; border-bottom: 1px solid var(--border); }
.brand img { width: 34px; height: 34px; border-radius: 8px; }
.brand-name { font-size: 16px; font-weight: 600; line-height: 1.25; }
.brand-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.3; }
#nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-bottom: 2px;
  border-radius: 8px; color: var(--text-2); font-weight: 500; cursor: pointer; border: none;
  background: none; width: 100%; text-align: left; font-size: 15px;
}
.nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
.nav-item:hover { background: #f0f1f2; color: var(--text); }
.nav-item.active { background: var(--primary-light); color: var(--primary); }
.nav-badge { margin-left: auto; background: var(--red); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 6px; line-height: 16px; }
.sidebar-foot { padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-3); }

/* ---------- main ---------- */
.main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar {
  height: 52px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 14px; flex-shrink: 0;
}
.page-title { font-size: 17px; font-weight: 600; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.global-search input {
  width: 220px; max-width: 100%; height: 32px; border: 1px solid var(--border); border-radius: 8px;
  padding: 0 12px; background: var(--bg); outline: none;
}
.global-search input:focus { border-color: var(--primary); background: #fff; }
.icon-btn {
  border: 1px solid var(--border); background: #fff; border-radius: 8px; height: 32px;
  padding: 0 12px; font-size: 14px; font-weight: 500; color: var(--text-2);
}
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn:hover { border-color: var(--primary); color: var(--primary); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
}
#view { flex: 1; overflow-y: auto; padding: 20px; }

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.card + .card { margin-top: 14px; }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
.grid { display: grid; gap: 14px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid-kpi-dash { grid-template-columns: 1fr 2fr; }
.muted { color: var(--text-2); }
.small { font-size: 14px; }
.tiny { font-size: 13px; }
.strong { font-weight: 600; }
.flex { display: flex; align-items: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
.mt-8 { margin-top: 8px; } .mt-16 { margin-top: 16px; }
.mb-16 { margin-bottom: 16px; }
.nowrap { white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--border); background: #fff; color: var(--text);
  font-size: 14px; font-weight: 500; white-space: nowrap;
}
.btn svg { width: 15px; height: 15px; flex-shrink: 0; }
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
.btn-danger { color: var(--red); }
.btn-danger:hover { border-color: var(--red); color: var(--red); }
.btn-sm { height: 26px; padding: 0 10px; font-size: 13px; border-radius: 6px; }

.pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill-green { background: var(--green-bg); color: var(--green); }
.pill-amber { background: var(--amber-bg); color: var(--amber); }
.pill-red { background: var(--red-bg); color: var(--red); }
.pill-blue { background: var(--blue-bg); color: var(--blue-text); }
.pill-purple { background: var(--purple-bg); color: var(--purple-text); }
.pill-gray { background: #f0f1f2; color: var(--text-2); }

.owner-chip { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 12px; font-weight: 600; }

/* ---------- KPI ---------- */
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.kpi-label { font-size: 14px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi-value { font-size: 30px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.kpi-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.kpi-icon svg { width: 16px; height: 16px; }

/* ---------- toolbar & table ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar .search { width: 240px; height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; background: #fff; outline: none; }
.toolbar .search:focus { border-color: var(--primary); }
.toolbar select { height: 34px; border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; background: #fff; outline: none; }
.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
table.data { width: 100%; border-collapse: collapse; }
table.data th {
  text-align: left; font-size: 14px; font-weight: 500; color: var(--text-2);
  padding: 10px 14px; border-bottom: 1px solid var(--border); background: #fafbfc; white-space: nowrap;
}
table.data td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.data tr:last-child td { border-bottom: none; }
table.data tbody tr { cursor: pointer; }
table.data tbody tr:hover { background: #f7f9ff; }
.row-actions { display: flex; gap: 6px; }
.link { color: var(--primary); cursor: pointer; font-weight: 500; }
.link:hover { text-decoration: underline; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- kanban ---------- */
.kanban { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-items: start; }
.kb-col { background: #eef0f2; border-radius: 10px; padding: 10px; min-height: 300px; }
.kb-col.drag-over { outline: 2px dashed var(--primary); outline-offset: -2px; }
.kb-head { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; padding: 2px 4px 10px; }
.kb-stage { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.kb-count { font-size: 13px; font-weight: 500; color: var(--text-2); background: #fff; border-radius: 999px; padding: 0 8px; line-height: 20px; flex-shrink: 0; align-self: flex-start; }
.kb-card {
  background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  margin-bottom: 8px; cursor: grab; box-shadow: 0 1px 2px rgba(31,35,41,.04);
}
.kb-card:active { cursor: grabbing; }
.kb-card.dragging { opacity: .5; }
.kb-card-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-card-meta { font-size: 13px; color: var(--text-2); display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.kb-amount { color: var(--primary); font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

/* ---------- modal & drawer ---------- */
.modal-mask { position: fixed; inset: 0; background: rgba(31,35,41,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
.modal { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; max-height: 88vh; display: flex; flex-direction: column; box-shadow: var(--shadow); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 17px; font-weight: 600; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }
.modal-close { border: none; background: none; font-size: 18px; color: var(--text-3); line-height: 1; padding: 4px; }
.drawer-mask { position: fixed; inset: 0; background: rgba(31,35,41,.35); z-index: 90; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 92vw; background: #fff;
  z-index: 95; box-shadow: var(--shadow); display: flex; flex-direction: column;
  animation: slidein .18s ease;
}
@keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 20px; }
.drawer-tab { padding: 10px 12px; font-size: 15px; font-weight: 500; color: var(--text-2); border: none; background: none; border-bottom: 2px solid transparent; }
.drawer-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

/* ---------- forms ---------- */
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.form-item { display: flex; flex-direction: column; gap: 5px; }
.form-item.full { grid-column: 1 / -1; }
.form-item label { font-size: 14px; color: var(--text-2); font-weight: 500; }
.form-item input, .form-item select, .form-item textarea {
  height: 36px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 10px; outline: none; background: #fff;
}
.form-item textarea { height: auto; padding: 8px 10px; resize: vertical; min-height: 70px; }
.form-item input:focus, .form-item select:focus, .form-item textarea:focus { border-color: var(--primary); }

/* ---------- misc ---------- */
.empty { text-align: center; padding: 48px 20px; color: var(--text-3); }
.empty svg { width: 40px; height: 40px; margin-bottom: 10px; opacity: .5; }
.activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.activity-icon svg { width: 15px; height: 15px; }
.activity-content { flex: 1; min-width: 0; }
.activity-title { font-weight: 500; font-size: 15px; }
.activity-meta { font-size: 13px; color: var(--text-3); margin-top: 2px; }
.timeline-date { font-size: 14px; font-weight: 600; color: var(--text-2); padding: 14px 0 6px; }
.detail-kv { display: grid; grid-template-columns: 88px 1fr; gap: 8px 12px; font-size: 15px; }
.detail-kv dt { color: var(--text-2); }
.section-title { font-size: 15px; font-weight: 600; margin: 18px 0 10px; }
.checkbox { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { width: 90px; font-size: 14px; color: var(--text-2); text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 20px; background: #f0f1f2; border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 5px; background: var(--primary); min-width: 2px; }
.bar-val { width: 70px; font-size: 14px; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
#toastRoot { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: #1f2329; color: #fff; font-size: 15px; padding: 9px 16px; border-radius: 8px; box-shadow: var(--shadow); animation: toastin .18s ease; }
@keyframes toastin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- receivables (AR) ---------- */
.grid-5 { grid-template-columns: repeat(5, 1fr); }
.progress { height: 6px; background: #f0f1f2; border-radius: 999px; overflow: hidden; margin-top: 4px; }
.progress > span { display: block; height: 100%; background: var(--green); }
.progress.warn > span { background: var(--amber); }
.progress.bad > span { background: var(--red); }
.num-neg { color: var(--red); font-variant-numeric: tabular-nums; }
.ar-board { overflow-x: auto; }
.inst-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.inst-row input { height: 36px; border: 1px solid var(--border-strong); border-radius: 8px; padding: 0 10px; outline: none; background: #fff; }

/* ---------- mobile bottom tab bar ---------- */
.mobile-nav { display: none; }

@media (max-width: 1100px) { .kanban { grid-template-columns: repeat(3, 1fr); } .grid-4 { grid-template-columns: repeat(2, 1fr); } .grid-5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 860px) {
  #sidebar { width: 60px; } .brand-text, .nav-item span, .sidebar-foot { display: none; }
  .kanban { grid-template-columns: 1fr; } .grid-4, .grid-3, .grid-2, .grid-kpi-dash, .grid-5 { grid-template-columns: 1fr; }
}

/* phone layout: hide the icon rail, switch to a bottom tab bar */
@media (max-width: 760px) {
  #app { flex-direction: column; height: 100vh; height: 100dvh; }
  #sidebar { display: none; }
  .main-wrap { height: 100%; }
  #topbar { height: 48px; padding: 0 12px; gap: 8px; }
  .page-title { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-shrink: 1; }
  .topbar-right { gap: 8px; }
  .global-search { flex: 1; min-width: 0; }
  .global-search input { width: 100%; height: 32px; }
  #langBtn { padding: 0 8px; height: 30px; }
  #view { padding: 12px; padding-bottom: calc(62px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
  .card { padding: 12px; }
  .grid-2, .grid-3, .grid-4, .grid-5, .grid-kpi-dash { grid-template-columns: 1fr; }
  .kanban { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .toolbar { gap: 8px; }
  .toolbar .search { width: 100%; }
  /* tables scroll horizontally instead of overflowing */
  .table-wrap, #memberList { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .detail-kv { grid-template-columns: 76px 1fr; }
  .modal { width: 100%; max-width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
  .drawer { width: 100%; max-width: 100%; }
  .modal-mask, .drawer-mask { padding: 0; }

  /* bottom tab bar */
  .mobile-nav {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
    background: #fff; border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .mobile-nav::-webkit-scrollbar { display: none; }
  .mnav-item {
    flex: 1 0 auto; min-width: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; padding: 7px 4px 6px; border: none; background: none; color: var(--text-2);
    font-size: 10px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .mnav-item svg { width: 20px; height: 20px; }
  .mnav-item.active { color: var(--primary); }
  .mnav-item.active svg { color: var(--primary); }
}
#app.no-auth .mobile-nav { display: none; }


/* ---------- responsive enhancements (v26) ---------- */
.grid > *, .form-grid > * { min-width: 0; }
.form-item input, .form-grid input,
.form-item select, .form-grid select { width: 100%; max-width: 360px; }
@media (max-width: 760px) {
  .grid-2 { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .card { padding: 12px; }
  .grid { gap: 10px; }
  .grid-3 { grid-template-columns: 1fr; }
  .detail-kv { grid-template-columns: 72px 1fr; font-size: 14px; }
  input { width: 100%; max-width: none; }
  .btn { width: 100%; justify-content: center; }
  .card-title { font-size: 15px; }
  .section-title { font-size: 13px; }
  .drawer-open #sidebar { width: 60px; }
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img id="brandIcon" alt="">
      <div class="brand-text">
        <div class="brand-name">JOYRUN CRM</div>
        <div class="brand-sub" id="brandSub">业务工作台</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <div class="main-wrap">
    <header id="topbar">
      <div class="page-title" id="pageTitle"></div>
      <div class="topbar-right">
        <div class="global-search" id="globalSearch"></div>
        <button class="icon-btn" id="langBtn" title="Language"></button>
        <div class="avatar" id="userAvatar">CW</div>
      </div>
    </header>
    <main id="view"></main>
  </div>
  <nav id="mobileNav" class="mobile-nav"></nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>

/* ================= JOYRUN CRM V2 (cloud) ================= */
'use strict';

/* ---------- i18n ---------- */
const I18N = {
zh: {
  dash:'仪表盘', customers:'客户管理', contacts:'联系人', pipeline:'商机管道', activities:'跟进记录',
  quotes:'报价单', contracts:'合同管理', payments:'回款跟踪', reports:'报表分析', settings:'设置',
  search:'搜索客户、商机…', langBtn:'EN', foot:'JOYRUN (SINGAPORE) PTE. LTD',
  loginTitle:'登录 JOYRUN CRM', loginSub:'输入邮箱接收验证码，首次登录自动创建账号',
  silentLoading:'正在登录…',
  larkLogin:'使用 Lark 登录', orEmail:'或使用邮箱验证码',

async function api(path, opts) {
  const r = await fetch(path, Object.assign({ credentials: 'include', headers: { 'Content-Type': 'application/json' } }, opts || {}));
  if (r.status === 401) { session = null; renderLogin(); throw new Error(lang === 'zh' ? '登录已过期，请重新登录' : 'Session expired, please sign in again'); }
  const j = await r.json().catch(() => ({}));

const errMsg = e => (e && e.message) ? String(e.message) : (lang === 'zh' ? '操作失败，请重试' : 'Operation failed, please retry');
const stripId = rec => { const c = { ...rec }; delete c.id; return c; };
function normalize(kind, r) {
  if (r.customerId !== undefined && r.customerId !== null && r.customerId !== '') r.customerId = String(r.customerId);
  if (r.contractId !== undefined && r.contractId !== null && r.contractId !== '') r.contractId = String(r.contractId);
  if (r.relId !== undefined && r.relId !== null && r.relId !== '') r.relId = String(r.relId);
  return r;
}
async function loadData() {
  const { records } = await api('/api/records');
  db = { customers: [], contacts: [], opportunities: [], activities: [], quotes: [], contracts: [], payments: [] };
  for (const row of records || []) {
    if (!db[row.kind]) continue;
    db[row.kind].push(normalize(row.kind, { id: row.id, ...(row.data || {}) }));
  }
  return true;
}
async function insertRow(kind, rec) {
  const { record } = await api('/api/records', { method: 'POST', body: JSON.stringify({ kind, data: rec }) });
  const saved = normalize(kind, { id: record.id, ...(record.data || {}) });
  db[kind].push(saved);
  return saved;
}
async function updateRow(kind, id, rec) {
  await api('/api/records/' + encodeURIComponent(id), { method: 'PUT', body: JSON.stringify({ kind, data: stripId(rec) }) });
}
async function deleteRow(kind, id) {

function hBarChart(rows) {
  const max = Math.max(...rows.map(r => r.value), 1);
  return rows.map(r => `
    <div class="bar-row">
      <div class="bar-label">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(r.value / max * 100).toFixed(1)}%;background:${r.color}"></div></div>
      <div class="bar-val">${esc(r.tip !== undefined ? r.tip : r.value)}</div>
    </div>`).join('');
}
function lineChart(series, labels) {
  const w = 640, h = 200, pad = 34;
  const all = series.flatMap(s => s.points);
  const max = Math.max(...all, 1) * 1.15, min = 0;
  const n = labels.length;
  const x = i => pad + (w - pad * 2) * (n <= 1 ? 0.5 : i / (n - 1));
  const y = v => h - pad - (v - min) / (max - min) * (h - pad * 2);
  let grid = '';
  for (let g = 0; g <= 3; g++) {
    const gy = pad + (h - pad * 2) * g / 3;
    const gv = max - (max - min) * g / 3;
    grid += `<line x1="${pad}" y1="${gy}" x2="${w - pad}" y2="${gy}" stroke="#e5e6e8" stroke-width="0.5"/><text x="${pad - 6}" y="${gy + 4}" text-anchor="end" font-size="11" fill="#8f959e">${gv >= 1000 ? (gv/1000).toFixed(0) + 'k' : Math.round(gv)}</text>`;
  }
  const paths = series.map(s => `<polyline points="${s.points.map((v, i) => x(i) + ',' + y(v)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>` +
    s.points.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#fff" stroke="${s.color}" stroke-width="2"/>`).join('')).join('');
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#8f959e">${esc(l)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">${grid}${paths}${xl}</svg>`;
}
function donutChart(segs) {
  const total = segs.reduce((a, s) => a + s.value, 0) || 1;
  const r = 52, c = 2 * Math.PI * r;
  let off = 0;
  const circles = segs.map(s => {
    const len = s.value / total * c;
    const el = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s.color}" stroke-width="24" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return el;
  }).join('');
  const legend = segs.map(s => `<div class="flex gap-8" style="margin-bottom:5px"><i style="width:9px;height:9px;border-radius:2px;background:${s.color};display:inline-block"></i><span class="small muted">${esc(s.label)}</span><span class="small strong" style="margin-left:auto">${s.value}</span></div>`).join('');
  return `<div class="flex gap-12" style="align-items:center"><svg viewBox="0 0 140 140" style="width:130px;flex-shrink:0">${circles}<text x="70" y="66" text-anchor="middle" font-size="20" font-weight="600" fill="#1f2329">${total}</text><text x="70" y="86" text-anchor="middle" font-size="11" fill="#8f959e">${esc(t('total'))}</text></svg><div style="flex:1">${legend}</div></div>`;
}

    </div>
  </div>`;
  $('#btnLark').onclick = () => { location.assign('/auth/lark'); };
  $('#btnCode').onclick = () => guard(async () => {
    const email = $('#loginEmail').value.trim();
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(lang === 'zh' ? '请输入正确的邮箱地址' : 'Enter a valid email address'); return; }
    $('#btnCode').disabled = true;
    const sent = await cloud.auth.sendOtp({ email });
    if (sent.error) { $('#btnCode').disabled = false; throw sent.error; }
    pendingOtp = { email, verificationId: sent.data.verificationId, isExistingUser: sent.data.isExistingUser };
    toast(t('codeSentTo') + email);
    let n = 60;
    $('#btnCode').textContent = n + 's';
    clearInterval(codeTimer);
    codeTimer = setInterval(() => {
      n--;
      if (n <= 0) { clearInterval(codeTimer); $('#btnCode').disabled = false; $('#btnCode').textContent = t('resend'); }
      else $('#btnCode').textContent = n + 's';
    }, 1000);
  });
  $('#btnLogin').onclick = () => guard(async () => {
    const email = $('#loginEmail').value.trim();
    const token = $('#loginCode').value.trim();
    if (!pendingOtp || pendingOtp.email !== email) { toast(lang === 'zh' ? '请先获取验证码' : 'Get a code for this email first'); return; }
    if (!token) { toast(lang === 'zh' ? '请输入验证码' : 'Enter the code'); return; }
    $('#btnLogin').disabled = true;
    const done = await cloud.auth.verifyOtp({
      email: pendingOtp.email,
      verificationId: pendingOtp.verificationId,
      isExistingUser: pendingOtp.isExistingUser,
      token,
    });
    if (done.error) { $('#btnLogin').disabled = false; throw done.error; }
    pendingOtp = null;
    clearInterval(codeTimer);
    const wbToken = await cloud.auth.getAccessToken();
    const { user } = await api('/api/session', { method: 'POST', body: JSON.stringify({ token: wbToken }) });
    session = { user };
    await afterLogin();
  });

function renderPipeline() {
  const cols = STAGES.map(s => {
    const list = db.opportunities.filter(o => o.stage === s.k).sort((a, b) => b.amount - a.amount);
    const sum = list.reduce((a, o) => a + o.amount, 0);
    return `<div class="kb-col" data-stage="${s.k}">
      <div class="kb-head"><div class="kb-stage"><span class="kb-dot" style="background:${s.c}"></span>${esc(stageLabel(s.k))}</div>
      <span class="kb-count">${list.length} · ${moneyShort(sum)}</span></div>
      ${list.map(o => `<div class="kb-card" draggable="true" data-opp="${o.id}">
        <div class="kb-card-name">${esc(o.name)}</div>
        <div class="tiny muted">${esc(custName(o.customerId))}</div>
        <div class="kb-card-meta"><span class="kb-amount">${money(o.amount)}</span><span class="flex gap-8">${ownerChip(o.owner)}<span class="tiny muted">${o.probability}%</span></span></div>
      </div>`).join('')}
    </div>`;
  }).join('');
  return `<div class="flex-between mb-16">
    <span class="muted small">${ico('pipe')} ${t('dragHint')}</span>
    <button class="btn btn-primary" id="oppAdd">${ico('plus')}${t('addOpp')}</button>
  </div>
  <div class="kanban">${cols}</div>`;
}
function bindPipeline() {
  const add = $('#oppAdd'); if (add) add.onclick = () => oppModal();
  document.querySelectorAll('.kb-card').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', card.dataset.opp);
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
    card.onclick = () => openOppDrawer(card.dataset.opp);
  });
  document.querySelectorAll('.kb-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      const o = db.opportunities.find(x => x.id === id);
      if (o && o.stage !== col.dataset.stage) {
        o.stage = col.dataset.stage;
        o.probability = stageOf(o.stage).p;
        guard(async () => {
          await updateRow('opportunities', o.id, o);
          render(); toast(stageLabel(o.stage) + ' · ' + o.name);
        });
      }
    });
  });
}

/* ---------- module: activities ---------- */
function renderActivities() {
  const tf = ($('#actType') || {}).value || '';
  const list = db.activities.filter(a => !tf || a.type === tf).sort((a, b) => b.date.localeCompare(a.date));
  const groups = {};
  list.forEach(a => { (groups[a.date] = groups[a.date] || []).push(a); });
  return `
  <div class="toolbar">
    <select id="actType">
      <option value="">${t('colType')} · ${t('total')}</option>
      ${['call','email','meeting','note','task'].map(x => `<option ${tf === x ? 'selected' : ''} value="${x}">${esc(typeLabel(x))}</option>`).join('')}
    </select>
    <button class="btn btn-primary" id="actAdd" style="margin-left:auto">${ico('plus')}${t('addActivity')}</button>
  </div>
  ${Object.keys(groups).length ? Object.entries(groups).map(([d, items]) => `
    <div class="card"><div class="timeline-date">${fdate(d)}</div>
    ${items.map(a => `
      <div class="activity-item">
        <div class="activity-icon" style="background:var(--${typeTone(a.type)}-bg);color:var(--${typeTone(a.type)}-text,var(--${typeTone(a.type)}))">${ico(typeIcon(a.type))}</div>
        <div class="activity-content">
          <div class="flex-between"><div class="activity-title">${esc(a.content)}</div>
          <div class="row-actions"><input type="checkbox" class="checkbox" data-done="${a.id}" ${a.done ? 'checked' : ''} title="${t('done')}">
          <button class="btn btn-sm" data-eact="${a.id}">${t('edit')}</button></div></div>
          <div class="activity-meta">${metaText(typeLabel(a.type), a.relType === 'customer' ? custName(a.relId) : oppName(a.relId), a.owner)}</div>
        </div>
      </div>`).join('')}</div>`).join('') : `<div class="card">${emptyBox()}</div>`}`;
}
function bindActivities() {
  const tf = $('#actType'); if (tf) tf.onchange = () => render();
  const add = $('#actAdd'); if (add) add.onclick = () => activityModal();
  document.querySelectorAll('[data-done]').forEach(cb => cb.onchange = () => {
    const a = db.activities.find(x => x.id === cb.dataset.done);
    a.done = cb.checked;
    guard(async () => { await updateRow('activities', a.id, a); render(); });
  });
  document.querySelectorAll('[data-eact]').forEach(b => b.onclick = () => activityModal(null, db.activities.find(x => x.id === b.dataset.eact)));
}
function activityModal(preType, act) {
  const relType = act ? act.relType : (preType || 'customer');
  const relList = relType === 'customer' ? db.customers : db.opportunities;
  const fields = [
    {k:'type', label: t('colType'), type: 'select', options: ['call','email','meeting','note','task'].map(x => ({v:x, t:typeLabel(x)}))},
    {k:'relType', label: t('related'), type: 'select', options: [{v:'customer', t:t('customers')}, {v:'opportunity', t:t('pipeline')}]},
    {k:'relId', label: t('colCustomer') + ' / ' + t('colName'), type: 'select', options: relList.map(x => ({v: x.id, t: x.name}))},
    {k:'date', label: t('colDate'), type: 'date'},
    {k:'owner', label: t('colOwner'), type: 'select', options: OWNERS.map(x => ({v:x, t:x}))},
    {k:'content', label: t('content'), type: 'textarea', full: true},
    {k:'done', label: t('colDone'), type: 'select', options: [{v:'1', t:t('done')}, {v:'', t:t('notDone')}], def: ''},
  ];
  const m = openModal(esc(act ? t('edit') : t('addActivity')),
    `<div class="form-grid">${formFields(fields, act || {relType, date: today(), owner: OWNERS[0]})}</div>`,
    `<button class="btn" data-close>${t('cancel')}</button><button class="btn btn-primary" id="mSave">${t('save')}</button>`);
  const relSel = m.querySelector('[name=relType]');
  relSel.onchange = () => {
    const rt = relSel.value;
    m.querySelector('[name=relId]').innerHTML = (rt === 'customer' ? db.customers : db.opportunities).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  };
  $('#mSave').onclick = () => guard(async () => {
    const v = readForm(m);
    if (!v.content) { toast(t('content')); return; }
    v.done = !!v.done;
    if (act) { Object.assign(act, v); await updateRow('activities', act.id, act); }
    else await insertRow('activities', v);
    closeModal(); closeDrawer(); render(); toast(t('saved'));
  });
}

/* ---------- ledger modules ---------- */

  const list = db.quotes.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const sum = s => list.filter(x => x.status === s).reduce((a, x) => a + x.amount, 0);
  return `
  <div class="grid grid-4 mb-16">
    ${[['stDraft', 'gray'], ['stSent', 'blue'], ['stAccepted', 'green'], ['stRejected', 'red']].map(([s, tone]) =>
      `<div class="kpi"><div class="kpi-label">${statusPill(t(s), tone)}</div><div class="kpi-value">${moneyShort(sum(s.toLowerCase().replace('st','')))}</div>
      <div class="kpi-sub">${list.filter(x => x.status === s.toLowerCase().replace('st','')).length}</div></div>`).join('')}

  <div class="toolbar"><button class="btn btn-primary" id="qAdd" style="margin-left:auto">${ico('plus')}${t('addQuote')}</button></div>

    <tbody>${list.map(q => `<tr data-q="${q.id}">

      <td>${quotePill(q.status)}</td><td>${fdate(q.validUntil)}</td><td class="muted">${fdate(q.createdAt)}</td></tr>`).join('') || `<tr><td colspan="6">${emptyBox()}</td></tr>`}</tbody>

function bindQuotes() {

function bindContracts() {
  const add = $('#cAdd'); if (add) add.onclick = () => ledgerModal('contracts');

  const sum = s => list.filter(x => effPayStatus(x) === s).reduce((a, x) => a + (Number(x.amount) || 0), 0);
  return `
  <div class="grid grid-3 mb-16">
    ${[['stPending','amber'], ['stPaid','green'], ['stOverdue','red']].map(([s, tone]) =>
      `<div class="kpi"><div class="kpi-label">${statusPill(t(s), tone)}</div><div class="kpi-value">${moneyShort(sum(s.toLowerCase().replace('st','')))}</div>
      <div class="kpi-sub">${list.filter(x => x.status === s.toLowerCase().replace('st','')).length}</div></div>`).join('')}
  </div>
  <div class="toolbar"><button class="btn btn-primary" id="pAdd" style="margin-left:auto">${ico('plus')}${t('addPayment')}</button></div>
  <div class="table-wrap"><table class="data">
    <thead><tr><th>${t('invoiceNo')}</th><th>${t('colCustomer')}</th><th>${t('colAmount')}</th><th>${t('colDue')}</th><th>${t('colStatus')}</th><th>${t('colPaid')}</th><th>${t('colActions')}</th></tr></thead>
    <tbody>${list.map(p => `<tr data-p="${p.id}">

function bindPayments() {
  const add = $('#pAdd'); if (add) add.onclick = () => ledgerModal('payments');
  document.querySelectorAll('[data-p]').forEach(tr => tr.onclick = e => {
    if (e.target.closest('button')) return;
    ledgerModal('payments', db.payments.find(x => x.id === tr.dataset.p));
  });
  document.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => {
    const p = db.payments.find(x => x.id === b.dataset.pay);
    p.status = 'paid'; p.paidDate = today();
    guard(async () => { await updateRow('payments', p.id, p); render(); toast(t('stPaid')); });
  });
}
function ledgerModal(kind, item) {
  const isQ = kind === 'quotes', isC = kind === 'contracts', isP = kind === 'payments';
  const fields = isQ ? [
    {k:'customerId', label: t('colCustomer'), type: 'select', options: db.customers.map(c => ({v: c.id, t: c.name}))},
    {k:'no', label: t('colNo'), ph: 'Q-2026-001'},
    {k:'amount', label: t('colAmount') + ' (SGD)', type: 'number'},
    {k:'status', label: t('colStatus'), type: 'select', options: ['draft','sent','accepted','rejected'].map(s => ({v:s, t:t('st' + s[0].toUpperCase() + s.slice(1))}))},
    {k:'validUntil', label: t('colValid'), type: 'date'},
    {k:'createdAt', label: t('createdAt'), type: 'date'},
  ] : isC ? [
    {k:'customerId', label: t('colCustomer'), type: 'select', options: db.customers.map(c => ({v: c.id, t: c.name}))},
    {k:'oppId', label: t('oppSource'), type: 'select', options: [{v:'', t:'—'}].concat(db.opportunities.map(o => ({v:o.id, t:o.name + ' · ' + money(o.amount)})))},
    {k:'no', label: t('colNo'), ph: 'C-2026-001'},
    {k:'amount', label: t('colAmount') + ' (SGD)', type: 'number'},
    {k:'status', label: t('colStatus'), type: 'select', options: ['approving','active','expired','ended'].map(s => ({v:s, t:t('st' + s[0].toUpperCase() + s.slice(1))}))},
    {k:'startDate', label: t('colStart'), type: 'date'},
    {k:'endDate', label: t('colEnd'), type: 'date'},
    {k:'owner', label: t('colOwner'), type: 'select', options: OWNERS.map(x => ({v:x, t:x}))},
    {k:'problem', label: t('problemFlag'), type: 'select', options: [{v:'1', t: lang === 'zh' ? '是' : 'Yes'}, {v:'', t: lang === 'zh' ? '否' : 'No'}]},
    {k:'problemAmount', label: t('problemAmount') + ' (SGD)', type: 'number'},
    {k:'problemNote', label: t('problemNote'), type: 'textarea', full: true},
    {k:'createdAt', label: t('createdAt'), type: 'date'},
  ] : [
    {k:'customerId', label: t('colCustomer'), type: 'select', options: db.customers.map(c => ({v: c.id, t: c.name}))},
    {k:'contractId', label: t('contracts'), type: 'select', options: [{v:'', t:'—'}].concat(db.contracts.map(c => ({v:c.id, t:c.no + ' · ' + custName(c.customerId)})))},
    {k:'invoiceNo', label: t('invoiceNo'), ph: 'INV-2026-001'},
    {k:'amount', label: t('colAmount') + ' (SGD)', type: 'number'},
    {k:'dueDate', label: t('colDue'), type: 'date'},
    {k:'status', label: t('colStatus'), type: 'select', options: ['pending','paid','overdue'].map(s => ({v:s, t:t('st' + s[0].toUpperCase() + s.slice(1))}))},
    {k:'paidDate', label: t('colPaid'), type: 'date'},
    {k:'owner', label: t('colOwner'), type: 'select', options: OWNERS.map(x => ({v:x, t:x}))},
    {k:'problem', label: t('problemFlag'), type: 'select', options: [{v:'1', t: lang === 'zh' ? '是' : 'Yes'}, {v:'', t: lang === 'zh' ? '否' : 'No'}]},
    {k:'problemNote', label: t('problemNote'), type: 'textarea', full: true},
  ];
  const instHtml = isC ? installmentsEditor(item ? item.installments : null) : '';
  const title = item ? t('edit') : (isQ ? t('addQuote') : isC ? t('addContract') : t('addPayment'));
  const m = openModal(esc(title), `<div class="form-grid">${formFields(fields, item || (isQ || isC ? {createdAt: today(), owner: OWNERS[0], status: isC ? 'approving' : 'draft'} : {}))}</div>${instHtml}`,
    `${item ? `<button class="btn btn-danger" id="mDel" style="margin-right:auto">${ico('trash')}${t('del')}</button>` : ''}
     <button class="btn" data-close>${t('cancel')}</button><button class="btn btn-primary" id="mSave">${t('save')}</button>`, isC ? 680 : 560);
  if (isC) {
    const add = m.querySelector('#instAdd'); if (add) add.onclick = () => { const list = m.querySelector('#instList'); list.insertAdjacentHTML('beforeend', instRow({})); list.querySelectorAll('[data-inst-del]').forEach(b => b.onclick = () => b.closest('[data-inst]').remove()); };
    m.querySelectorAll('[data-inst-del]').forEach(b => b.onclick = () => b.closest('[data-inst]').remove());
  }
  if (item) $('#mDel').onclick = () => confirmModal(t('deleteConfirm'), () => guard(async () => {
    await deleteRow(kind, item.id);
    db[kind] = db[kind].filter(x => x.id !== item.id);
    closeModal(); render(); toast(t('deleted'));
  }));
  $('#mSave').onclick = () => guard(async () => {
    const v = readForm(m);
    v.amount = Number(v.amount) || 0;
    if ((isQ || isC) && !v.no) { toast(t('colNo')); return; }
    if (isP && !v.invoiceNo) { toast(t('invoiceNo')); return; }
    if (isC) { v.problem = !!v.problem; v.problemAmount = Number(v.problemAmount) || 0; v.installments = readInstallments(); }
    if (isP) { v.problem = !!v.problem; }
    if (item) { Object.assign(item, v); await updateRow(kind, item.id, item); }
    else await insertRow(kind, v);
    closeModal(); render(); toast(t('saved'));
  });
}

/* ---------- module: receivables (AR) ---------- */
function renderAR() {
  const fc = ($('#arCountry') || {}).value || '';
  const fo = ($('#arOwner') || {}).value || '';
  const contr = db.contracts.filter(c => (!fc || custCountry(c.customerId) === fc) && (!fo || c.owner === fo));
  const total = contr.reduce((a, c) => a + contractTotal(c), 0);
  const recv = contr.reduce((a, c) => a + contractReceived(c), 0);
  const out = total - recv;
  const ov = contr.reduce((a, c) => a + contractOverdue(c), 0);
  const prob = contr.reduce((a, c) => a + contractProblem(c), 0);
  const kpis = [
    [t('arContractTotal'), total, 'blue'], [t('arReceived'), recv, 'green'],
    [t('arOutstanding'), out, 'amber'], [t('arOverdue'), ov, 'red'], [t('arProblem'), prob, 'purple'],
  ];
  const countryOpts = [{ v: '', t: t('allCountries') }].concat(COUNTRIES.map(c => ({ v: c, t: c })));
  const ownerOpts = [{ v: '', t: t('allOwners') }].concat(OWNERS.map(o => ({ v: o, t: o })));
  const overdue = [];
  contr.forEach(c => db.payments.filter(p => String(p.contractId) === String(c.id) && isOverdue(p)).forEach(p => overdue.push({ p, c })));
  overdue.sort((a, b) => a.p.dueDate.localeCompare(b.p.dueDate));
  const now = new Date();
  const months = []; for (let i = -2; i <= 9; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); months.push(d.toISOString().slice(0, 7)); }
  const boardCountries = fc ? [fc] : COUNTRIES.filter(c => contr.some(x => custCountry(x.customerId) === c));
  const sched = {}, recd = {};
  boardCountries.forEach(c => { sched[c] = {}; recd[c] = {}; months.forEach(m => { sched[c][m] = 0; recd[c][m] = 0; }); });
  contr.forEach(c => { const ctr = custCountry(c.customerId); if (!sched[ctr]) return; (c.installments || []).forEach(it => { if (sched[ctr][it.month] !== undefined) sched[ctr][it.month] += Number(it.amount) || 0; }); });
  contr.forEach(c => { const ctr = custCountry(c.customerId); if (!recd[ctr]) return; db.payments.filter(p => String(p.contractId) === String(c.id) && p.status === 'paid' && p.paidDate).forEach(p => { const m = p.paidDate.slice(0, 7); if (recd[ctr][m] !== undefined) recd[ctr][m] += Number(p.amount) || 0; }); });
  return `
  <div class="toolbar">
    <select id="arCountry">${countryOpts.map(o => `<option value="${o.v}" ${fc === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>
    <select id="arOwner">${ownerOpts.map(o => `<option value="${o.v}" ${fo === o.v ? 'selected' : ''}>${esc(o.t)}</option>`).join('')}</select>
    <span class="muted small" style="margin-left:auto">${t('arContractTotal')} ${money(total)} · ${t('arReceived')} ${money(recv)}</span>
  </div>
  <div class="grid grid-5 mb-16">
    ${kpis.map(([l, v, tone]) => `<div class="kpi"><div class="kpi-label">${esc(l)}</div><div class="kpi-value ${tone === 'red' || tone === 'amber' ? 'num-neg' : ''}">${money(v)}</div></div>`).join('')}
  </div>
  <div class="card mb-16">
    <div class="card-title">${t('arProgress')}</div>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>${t('colNo')}</th><th>${t('colCustomer')}</th><th>${t('colCountry')}</th><th>${t('colOwner')}</th><th>${t('colAmount')}</th><th>${t('arReceived')}</th><th>${t('arOutstanding')}</th><th>${t('arOverdue')}</th><th>${t('arProblem')}</th><th>${t('arProgress')}</th><th>${t('colStatus')}</th></tr></thead>
      <tbody>${contr.length ? contr.map(c => {
        const ct = contractTotal(c), rv = contractReceived(c), ot = contractOutstanding(c), ovd = contractOverdue(c), pr = contractProblem(c);
        const pct = ct ? Math.round(rv / ct * 100) : 0;
        const tone = pct >= 100 ? '' : pct >= 60 ? 'warn' : 'bad';
        return `<tr data-c="${c.id}">
          <td class="strong">${esc(c.no)}</td><td>${esc(custName(c.customerId))}</td><td>${esc(custCountry(c.customerId))}</td><td>${ownerChip(c.owner)}</td>
          <td class="num">${money(ct)}</td><td class="num">${money(rv)}</td><td class="num ${ot > 0 ? 'num-neg' : ''}">${money(ot)}</td>
          <td class="num ${ovd > 0 ? 'num-neg' : ''}">${money(ovd)}</td><td class="num ${pr > 0 ? 'num-neg' : ''}">${money(pr)}</td>
          <td style="min-width:120px"><div class="progress ${tone}"><span style="width:${pct}%"></span></div><span class="tiny muted">${pct}%</span></td>
          <td>${contractPill(c.status)}${c.problem ? statusPill(t('problemFlag'), 'red') : ''}</td></tr>`;
      }).join('') : `<tr><td colspan="11">${emptyBox()}</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="card mb-16">
    <div class="card-title">${t('arOverdueList')}</div>
    ${overdue.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>${t('invoiceNo')}</th><th>${t('colCustomer')}</th><th>${t('colCountry')}</th><th>${t('colDue')}</th><th>${t('daysOverdue')}</th><th>${t('colAmount')}</th><th>${t('problemFlag')}</th></tr></thead>
    <tbody>${overdue.map(({ p, c }) => { const days = Math.max(0, Math.floor((new Date() - new Date(p.dueDate)) / 86400000)); return `<tr data-p="${p.id}">
      <td class="strong">${esc(p.invoiceNo)}</td><td>${esc(custName(p.customerId))}</td><td>${esc(custCountry(c.customerId))}</td>
      <td>${fdate(p.dueDate)}</td><td class="num num-neg">${days}</td><td class="num num-neg">${money(Number(p.amount) || 0)}</td>
      <td>${p.problem ? statusPill(t('problemFlag'), 'red') : ''}</td></tr>`; }).join('')}</tbody></table></div>` : `<div class="muted small">${t('arNoOverdue')}</div>`}
  </div>
  <div class="card">
    <div class="card-title">${t('arCountryBoard')} <span class="tiny muted">${t('arHintInst')}</span></div>
    <div class="ar-board"><table class="data"><thead><tr><th>${t('month')}</th>${boardCountries.map(c => `<th>${esc(c)}</th>`).join('')}<th>${esc(t('total'))}</th></tr></thead>
    <tbody>${months.map(m => {
      let rowTotS = 0, rowTotR = 0;
      const cells = boardCountries.map(c => {
        const s = sched[c][m] || 0, r = recd[c][m] || 0; rowTotS += s; rowTotR += r;
        const sf = s - r;
        return `<td class="num">${s ? money(r) + '<br><span class="tiny muted">' + money(s) + '</span>' : '<span class="tiny muted">—</span>'}${sf > 0 ? ` <span class="tiny num-neg">(${t('arShortfall')}${money(sf)})</span>` : ''}</td>`;
      });
      const rowSf = rowTotS - rowTotR;
      return `<tr><td class="strong">${esc(m)}</td>${cells}<td class="num">${rowTotS ? money(rowTotR) + '<br><span class="tiny muted">' + money(rowTotS) + '</span>' : '<span class="tiny muted">—</span>'}${rowSf > 0 ? ` <span class="tiny num-neg">(${t('arShortfall')}${money(rowSf)})</span>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>
  </div>`;
}
function bindAR() {
  const fc = $('#arCountry'); if (fc) fc.onchange = () => render();
  const fo = $('#arOwner'); if (fo) fo.onchange = () => render();
  document.querySelectorAll('[data-c]').forEach(tr => tr.onclick = () => ledgerModal('contracts', db.contracts.find(x => x.id === tr.dataset.c)));
  document.querySelectorAll('[data-p]').forEach(tr => tr.onclick = () => ledgerModal('payments', db.payments.find(x => x.id === tr.dataset.p)));
}

/* ---------- module: reports ---------- */
function renderReports() {
  const conv = STAGES.filter(s => s.k !== 'lost' && s.k !== 'won').map((s, i) => {
    const cur = db.opportunities.filter(o => o.stage === s.k).length;
    const prev = db.opportunities.filter(o => o.stage === STAGES[i].k).length;
    return {label: stageLabel(s.k), value: i === 0 ? cur : (prev ? Math.round(cur / prev * 100) : 0), color: s.c, tip: (i === 0 ? cur : (prev ? Math.round(cur / prev * 100) : 0)) + '%'};
  });
  const byOwner = OWNERS.map((o, i) => {
    const sum = db.opportunities.filter(x => x.owner === o && x.stage !== 'lost').reduce((a, x) => a + x.amount, 0);
    return {label: o.split(' ').map(w => w[0]).join(''), value: sum, color: ['#1456f0','#378add','#6849c9','#d9800d','#2ea44f','#d83931'][i], tip: moneyShort(sum)};
  }).filter(r => r.value > 0);
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push(d.toISOString().slice(0, 7)); }
  const trend = months.map(m => db.opportunities.filter(o => (o.createdAt || '').startsWith(m)).length);
  const wonTrend = months.map(m => db.opportunities.filter(o => o.stage === 'won' && (o.expectedClose || '').startsWith(m)).length);
  const byCountry = COUNTRIES.map((c, i) => ({label: c, value: db.customers.filter(x => x.country === c).length, color: ['#1456f0','#378add','#6849c9','#d9800d','#2ea44f','#d83931','#8f959e'][i]})).filter(r => r.value > 0);
  const CC = ['#1456f0','#378add','#6849c9','#d9800d','#2ea44f','#d83931','#8f959e'];
  const fMonths = []; for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); fMonths.push(d.toISOString().slice(0, 7)); }
  const recvSeries = fMonths.map(m => db.payments.filter(p => p.status === 'paid' && (p.paidDate || '').startsWith(m)).reduce((a, p) => a + (Number(p.amount) || 0), 0));
  const schedSeries = fMonths.map(m => db.contracts.reduce((a, c) => a + (c.installments || []).filter(it => it.month === m).reduce((b, it) => b + (Number(it.amount) || 0), 0), 0));
  const byCountryVal = COUNTRIES.map((c, i) => ({label: c, value: db.contracts.filter(x => custCountry(x.customerId) === c && x.status === 'active').reduce((a, x) => a + contractTotal(x), 0), color: CC[i]})).filter(r => r.value > 0);
  const aging = [['<30', 0], ['30-60', 0], ['60-90', 0], ['>90', 0]];
  db.payments.filter(p => isOverdue(p)).forEach(p => { const days = Math.floor((new Date() - new Date(p.dueDate)) / 86400000); const amt = Number(p.amount) || 0; if (days < 30) aging[0][1] += amt; else if (days < 60) aging[1][1] += amt; else if (days < 90) aging[2][1] += amt; else aging[3][1] += amt; });
  const agingSegs = aging.map((a, i) => ({label: a[0], value: a[1], color: ['#d9800d','#e8632a','#e8451f','#d83931'][i]})).filter(s => s.value > 0);
  const fLabels = fMonths.map(m => t('months')[Number(m.slice(5)) - 1]);
  return `
  <div class="grid grid-2">
    <div class="card"><div class="card-title">${t('repConversion')}</div>${hBarChart(conv)}</div>
    <div class="card"><div class="card-title">${t('repByOwner')}</div>${hBarChart(byOwner)}</div>
    <div class="card"><div class="card-title">${t('repTrend')}</div>${lineChart([{name:'new', color:'#1456f0', points: trend}, {name:'won', color:'#2ea44f', points: wonTrend}], months.map(m => t('months')[Number(m.slice(5)) - 1]))}
      <div class="legend"><span><i style="background:#1456f0"></i>${lang === 'zh' ? '新增商机' : 'New deals'}</span><span><i style="background:#2ea44f"></i>${lang === 'zh' ? '赢单' : 'Won'}</span></div></div>
    <div class="card"><div class="card-title">${t('repCountry')}</div>${donutChart(byCountry)}</div>
  </div>
  <div class="section-title" style="margin-top:8px">${t('arByCountry')}</div>
  <div class="grid grid-3">
    <div class="card"><div class="card-title">${t('recvByMonth')}</div>${lineChart([{name: t('arReceivedMonth'), color: '#2ea44f', points: recvSeries}, {name: t('arScheduledMonth'), color: '#1456f0', points: schedSeries}], fLabels)}
      <div class="legend"><span><i style="background:#2ea44f"></i>${t('arReceivedMonth')}</span><span><i style="background:#1456f0"></i>${t('arScheduledMonth')}</span></div></div>
    <div class="card"><div class="card-title">${t('countryContractVal')}</div>${hBarChart(byCountryVal)}</div>
    <div class="card"><div class="card-title">${t('arAging')}</div>${donutChart(agingSegs)}</div>
  </div>`;
}

  const { members } = await api('/api/members');
  membersCache = members || [];
  return membersCache;
}

  const isAdmin = session && session.user && session.user.role === 'admin';
  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="card-title">${t('setLang')}</div>
      <div class="flex gap-8">
        <button class="btn ${lang === 'zh' ? 'btn-primary' : ''}" id="setZh">中文</button>
        <button class="btn ${lang === 'en' ? 'btn-primary' : ''}" id="setEn">English</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">${t('currentUser')}</div>
      <dl class="detail-kv">
        <dt>${lang === 'zh' ? '账号' : 'Account'}</dt><dd>${esc(userLine)}</dd>
        <dt>${t('colRole')}</dt><dd>${isAdmin ? statusPill(t('roleAdmin'), 'purple') : statusPill(t('roleMember'), 'blue')}</dd>
      </dl>
      <div class="flex gap-8 mt-16">
        <button class="btn" id="setLogout">${ico('logout')}${t('logout')}</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">${t('members')}</div>
      <div id="memberList"><div class="muted small">${lang === 'zh' ? '加载中…' : 'Loading…'}</div></div>
      ${isAdmin ? `
      <div class="section-title">${t('inviteMember')}</div>
      <div class="form-grid">
        <div class="form-item full"><label>${esc(t('inviteEmail'))}</label><input id="invEmail" type="email" placeholder="colleague@joyrun.work"></div>
        <div class="form-item full"><label>${esc(t('inviteName'))}</label><input id="invName" placeholder="Zhang Wei"></div>
      </div>
      <button class="btn btn-primary mt-8" id="btnInvite">${ico('mail')}${t('inviteBtn')}</button>` : ''}
    </div>
    <div class="card">
      <div class="card-title">${t('setData')}</div>
      <p class="muted small mb-16">${t('cloudSync')} · ${db.customers.length} ${t('customers')} · ${db.opportunities.length} ${t('pipeline')} · ${db.activities.length} ${t('activities')}</p>
      ${isAdmin ? `<div class="flex gap-8">
        <button class="btn btn-danger" id="setClear">${ico('trash')}${t('clearAll')}</button>
      </div>` : `<p class="muted small">${lang === 'zh' ? '仅管理员可清空数据' : 'Only admins can clear data'}</p>`}
    </div>
    <div class="card">
      <div class="card-title">${t('demoData')}</div>
      <dl class="detail-kv">
        <dt>${t('version')}</dt><dd>${window.BUILD_ID || 'v1'}</dd>
        <dt>App ID</dt><dd class="tiny">cli_aa53602cc278de12</dd>
        <dt>${t('foot')}</dt><dd>JOYRUN (SINGAPORE) PTE. LTD</dd>
      </dl>
    </div>
  </div>`;
}
function renderMemberList() {
  const box = $('#memberList');
  if (!box) return;
  const isAdmin = session && session.user && session.user.role === 'admin';
  const meSub = session && session.user && session.user.sub;
  if (!membersCache.length) { box.innerHTML = `<div class="muted small">${lang === 'zh' ? '暂无成员' : 'No members'}</div>`; return; }
  const roleBtn = m => lang === 'zh' ? (m.role === 'admin' ? '设为成员' : '设为管理员') : (m.role === 'admin' ? 'Make member' : 'Make admin');
  box.innerHTML = `<table class="data"><thead><tr><th>${lang === 'zh' ? '姓名' : 'Name'}</th><th>${lang === 'zh' ? '邮箱' : 'Email'}</th><th>${t('colRole')}</th>${isAdmin ? `<th>${lang === 'zh' ? '操作' : 'Action'}</th>` : ''}</tr></thead>
    <tbody>${membersCache.map(m => `<tr><td class="strong">${esc(m.name || '—')}</td><td>${esc(m.email || '—')}</td>
    <td>${m.role === 'admin' ? statusPill(t('roleAdmin'), 'purple') : statusPill(t('roleMember'), 'blue')}</td>${!isAdmin ? '' : (m.sub === meSub && m.role === 'admin') ? `<td><span class="tiny muted">${lang === 'zh' ? '当前账号' : 'you'}</span></td>` : `<td class="row-actions"><button class="btn btn-sm role-btn" data-sub="${esc(m.sub)}" data-to="${m.role === 'admin' ? 'member' : 'admin'}">${roleBtn(m)}</button><button class="btn btn-sm btn-danger" data-del="${esc(m.sub)}">${t('removeMember')}</button></td>`}</tr>`).join('')}</tbody></table>`;
  box.querySelectorAll('.role-btn').forEach(b => { b.onclick = () => guard(async () => {
    await api('/api/members/role', { method: 'POST', body: JSON.stringify({ sub: b.dataset.sub, role: b.dataset.to }) });
    toast(lang === 'zh' ? '成员权限已更新' : 'Member role updated');
    await loadMembers(); renderMemberList();
  }); });
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmModal(t('removeConfirm'), () => guard(async () => {
    await api('/api/members', { method: 'DELETE', body: JSON.stringify({ sub: b.dataset.del }) });
    toast(lang === 'zh' ? '成员已移除' : 'Member removed');
    await loadMembers(); renderMemberList();
  })));
}
function bindSettings() {
  const zh = $('#setZh'); if (zh) zh.onclick = () => { lang = 'zh'; localStorage.setItem('joyrun_lang', lang); renderShell(); render(); };
  const en = $('#setEn'); if (en) en.onclick = () => { lang = 'en'; localStorage.setItem('joyrun_lang', lang); renderShell(); render(); };
  const cl = $('#setClear'); if (cl) cl.onclick = () => confirmModal(t('clearWarn'), () => guard(async () => { await clearAll(); render(); toast(t('clearDone')); }));
  const lo = $('#setLogout'); if (lo) lo.onclick = () => guard(async () => { await api('/api/logout', { method: 'POST' }); session = null; renderLogin(); });
  const inv = $('#btnInvite'); if (inv) inv.onclick = () => guard(async () => {
    const email = ($('#invEmail').value || '').trim();
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast(lang === 'zh' ? '请输入正确的邮箱地址' : 'Enter a valid email address'); return; }
    await api('/api/members', { method: 'POST', body: JSON.stringify({ email, name: ($('#invName').value || '').trim() }) });
    toast(t('invited'));
    await loadMembers(); renderMemberList();
  });
  loadMembers().then(renderMemberList).catch(() => {});
}

/* ---------- shared ---------- */
function emptyBox() { return `<div class="empty">${ico('search')}<div>${t('noData')}</div></div>`; }

/* ---------- router ---------- */
const RENDER = {
  dash: [renderDashboard, bindDashboard],
  customers: [renderCustomers, bindCustomers],
  contacts: [renderContacts, bindContacts],
  pipeline: [renderPipeline, bindPipeline],
  activities: [renderActivities, bindActivities],
  quotes: [renderQuotes, bindQuotes],
  contracts: [renderContracts, bindContracts],
  payments: [renderPayments, bindPayments],
  ar: [renderAR, bindAR],
  reports: [renderReports, null],
  settings: [renderSettings, bindSettings],
};
function render() {
  const ae = document.activeElement;
  const keepId = ae && ae.id ? ae.id : '';
  const keepSel = ae && ae.selectionStart;
  const [r, b] = RENDER[route] || RENDER.dash;
  $('#view').innerHTML = r();
  if (b) b();
  if (keepId) {
    const back = document.getElementById(keepId);
    if (back && back.focus) {
      back.focus();
      try { back.setSelectionRange(keepSel, keepSel); } catch (e) {}
    }
  }
  $('#view').scrollTop = 0;
}

/* ---------- boot ---------- */
const LARK_APP_ID = 'cli_aa53602cc278de12';
function showLoginLoading() {
  document.getElementById('app').classList.add('no-auth');
  route = 'dash';
  $('#view').innerHTML = `
  <div style="max-width:420px;margin:56px auto">
    <div class="card" style="padding:48px 32px;text-align:center">
      <img src="${ICON_URL}" style="width:48px;height:48px;border-radius:12px">
      <div class="muted" style="margin-top:16px">${esc(t('silentLoading'))}</div>
    </div>
  </div>`;
}
let silentErrMsg = '';
// Mobile Lark webviews don't auto-inject the JSAPI bridge (window.h5sdk); load it ourselves.
const H5SDK_SRC = 'https://lf-package-sg.larksuitecdn.com/obj/lark-static-sgsaas/lark/op/h5-js-sdk-1.5.44.js';
async function waitForH5sdk(timeoutMs) {
  const start = Date.now();
  return new Promise(resolve => {
    (function poll() {
      if (window.h5sdk) return resolve(true);
      if (Date.now() - start > timeoutMs) return resolve(false);
      setTimeout(poll, 120);
    })();
  });
}
async function ensureH5sdk() {
  if (window.h5sdk) return true;
  await new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = H5SDK_SRC;
    s.onload = () => resolve();
    s.onerror = () => resolve();
    document.head.appendChild(s);
  });
  return waitForH5sdk(4000);
}
async function trySilentLogin() {
  showLoginLoading();
  silentErrMsg = '';
  if (!(await ensureH5sdk())) { silentErrMsg = 'Lark JSAPI (h5sdk) 脚本加载失败，无法静默登录'; return false; }
  // JSAPI auth: mobile needs explicit h5sdk.config (desktop client usually pre-configs it)
  try {
    const pageUrl = location.href.split('#')[0];
    const cfg = await api('/api/lark-jsapi-config?url=' + encodeURIComponent(pageUrl));
    await new Promise((resolve) => {
      window.h5sdk.config({
        appId: cfg.appId, timestamp: cfg.timestamp, nonceStr: cfg.nonceStr,
        signature: cfg.signature, jsApiList: ['requestAccess'],
        onSuccess: () => resolve(),
        onFail: (e) => { silentErrMsg = 'JSAPI 鉴权失败：' + JSON.stringify(e); resolve(); },
      });
    });
  } catch (e) { silentErrMsg = 'JSAPI 鉴权请求失败：' + ((e && e.message) || e); }
  try {
    const code = await new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error('h5sdk timeout')), 8000);
      window.h5sdk.ready(() => {
        const tt = window.tt || {};
        if (typeof tt.requestAccess === 'function') {
          tt.requestAccess({ appID: LARK_APP_ID, scopeList: [], success: r => { clearTimeout(timer); resolve(r.code); }, fail: e => { clearTimeout(timer); reject(new Error('requestAccess fail: ' + JSON.stringify(e))); } });
        } else if (typeof tt.requestAuthCode === 'function') {
          tt.requestAuthCode({ appId: LARK_APP_ID, success: r => { clearTimeout(timer); resolve(r.code); }, fail: e => { clearTimeout(timer); reject(new Error('requestAuthCode fail: ' + JSON.stringify(e))); } });
        } else { clearTimeout(timer); reject(new Error('no Lark login jsapi')); }
      });
    });
    const { user } = await api('/api/lark-silent', { method: 'POST', body: JSON.stringify({ code }) });
    session = { user };
    await enterApp();
    return true;
  } catch (e) {
    if (!silentErrMsg) silentErrMsg = (e && e.message) || String(e);
    if (String(e.message || '').indexOf('not invited') !== -1) { renderPending(); return true; }
    return false;
  }
}
async function enterApp() {
  document.getElementById('app').classList.remove('no-auth');
  renderShell();
  render();
}
async function boot() {
  try {
    const { user } = await api('/api/me');
    if (user && user.sub) {
      session = { user };
      if (user.role === 'none') { renderPending(); return; }
      await loadData();
      enterApp();
      return;
    }
  } catch (e) { /* fall through */ }
  if (await trySilentLogin()) return;
  renderLogin();
}
boot();
